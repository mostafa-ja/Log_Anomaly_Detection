name: CI - Lint, Test & Smoke Benchmarks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 src tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Run Test Suite with Pytest
      run: |
        python -m pytest -v --durations=10

    - name: Run Model Smoke Training
      run: |
        python -m src.train --model deeplog --epochs 1 --num-sessions 50 --batch-size 16 --num-classes 10
        python -m src.evaluate --model deeplog --num-classes 10
